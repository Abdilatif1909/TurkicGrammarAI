openapi: 3.0.3
info:
  title: TurkicGrammarAI API
  version: 1.0.0
  description: AI-powered comparative-historical Turkic linguistics platform API.
paths:
  /api/admin/languages/:
    get:
      operationId: api_admin_languages_list
      parameters:
      - in: query
        name: branch
        schema:
          type: string
        description: Filter by language branch.
      - in: query
        name: code
        schema:
          type: string
        description: Filter by language code.
      - in: query
        name: country
        schema:
          type: string
        description: Filter by country.
      - in: query
        name: family
        schema:
          type: string
        description: Filter by language family.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Admin Languages
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLanguageList'
          description: ''
    post:
      operationId: api_admin_languages_create
      parameters:
      - in: query
        name: branch
        schema:
          type: string
        description: Filter by language branch.
      - in: query
        name: code
        schema:
          type: string
        description: Filter by language code.
      - in: query
        name: country
        schema:
          type: string
        description: Filter by country.
      - in: query
        name: family
        schema:
          type: string
        description: Filter by language family.
      tags:
      - Admin Languages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LanguageWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LanguageWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageWrite'
          description: ''
  /api/admin/languages/{id}/:
    get:
      operationId: api_admin_languages_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin Languages
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageWrite'
          description: ''
    put:
      operationId: api_admin_languages_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin Languages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LanguageWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LanguageWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageWrite'
          description: ''
    patch:
      operationId: api_admin_languages_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin Languages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLanguageWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLanguageWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLanguageWrite'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageWrite'
          description: ''
    delete:
      operationId: api_admin_languages_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin Languages
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/languages/export/:
    get:
      operationId: api_admin_languages_export_retrieve
      description: Export all languages in CSV or JSON format. Use `?format=csv` or
        `?format=json`.
      summary: Export languages
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
        description: Export format.
      tags:
      - Admin Languages
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/seed/languages/:
