components:
  schemas:
    ActionResult:
      type: object
      properties:
        success:
          type: boolean
        detail:
          type: string
        created:
          type: integer
    CognateEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        language:
          type: string
          maxLength: 16
        word:
          type: string
          maxLength: 255
        lemma:
          type: string
          maxLength: 255
        ipa:
          type: string
          maxLength: 255
        meaning:
          type: string
          maxLength: 512
        source:
          type: string
          maxLength: 255
        confidence_score:
          type: number
          format: double
      required:
      - id
      - language
      - word
    CognateSet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        proto_form:
          type: string
          maxLength: 255
        gloss:
          type: string
          maxLength: 512
        notes:
          type: string
        confidence_score:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CognateEntry'
          readOnly: true
